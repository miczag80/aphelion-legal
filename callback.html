<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aphelion Uploader Sign-in</title>
<style>
:root{--bg:#f5f6f8;--fg:#1b1e26;--muted:#5a6172;--box:#fff;--rule:#dde0e7;--accent:#3d4f8a}
@media (prefers-color-scheme:dark){:root{--bg:#12141a;--fg:#e6e8ee;--muted:#9aa1b2;--box:#1a1d25;--rule:#2c3140;--accent:#9fb1ec;color-scheme:dark}}
body{background:var(--bg);color:var(--fg);font:17px/1.5 system-ui,sans-serif;margin:0;padding:40px 16px}
.w{max-width:60ch;margin:0 auto}h1{font-size:1.5rem;margin:0 0 8px}p{color:var(--muted)}
textarea{width:100%;box-sizing:border-box;min-height:7em;font:14px ui-monospace,monospace;background:var(--box);color:var(--fg);border:1px solid var(--rule);border-radius:6px;padding:10px}
button{margin-top:10px;font:600 16px system-ui;background:var(--accent);color:var(--bg);border:0;border-radius:6px;padding:10px 18px;cursor:pointer}
</style></head><body><div class="w">
<h1 id="h">Aphelion Uploader</h1>
<p id="m">Copy everything below and paste it back to Claude.</p>
<textarea id="t" readonly></textarea>
<button id="b" type="button">Copy</button>
</div><script>
var t=document.getElementById('t'),q=new URLSearchParams(location.search);
t.value=location.href;
if(q.get('error')){document.getElementById('h').textContent='Sign-in was not completed';document.getElementById('m').textContent='TikTok returned an error: '+q.get('error')+(q.get('error_description')?' ('+q.get('error_description')+')':'')+'. Copy the text below to Claude anyway.';}
else if(!q.get('code')){document.getElementById('m').textContent='This page receives the TikTok sign-in result for the Aphelion uploader. Nothing to do here right now.';}
document.getElementById('b').onclick=function(){t.select();try{navigator.clipboard.writeText(t.value).then(function(){document.getElementById('b').textContent='Copied'},function(){})}catch(e){}};
</script></body></html>
